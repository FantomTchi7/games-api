openapi: 3.0.2
info:
    title: games-api
    version: 1.0.0
    description: A brand new API with no content.  Go nuts!
paths:
    /games:
        get:
            tags:
                - games
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: string
                            examples:
                                List of games:
                                    value: |-
                                        [
                                            'Witcher 3',
                                            'Cyberpunk 2077'
                                        ]
                    description: A list of games
            summary: Gets a list of games
            description: Returns a list of games
        post:
            requestBody:
                description: '123'
                content:
                    new-game:
                        schema:
                            format: float
                            type: number
                        examples:
                            ' new-game':
                                value:
                                    name: Tetris
                                    price: 0.99
                required: true
            tags:
                - new-game
            responses:
                '201':
                    content:
                        new-game: {}
                    description: Created
                '400':
                    content:
                        application/json: {}
                    description: One or all params are missing
            summary: Creates a game
            description: Creates a new game
    '/games/{id}':
        get:
            tags:
                - details
            responses:
                '200':
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: string
                            examples:
                                Full details of a given game:
                                    value: |-
                                        [
                                            {id: 1, name: "Witcher 3", price: 29.99},
                                            {id: 2, name: "Cyberpunk 2077", price: 59.99},
                                            {id: 3, name: "Minecraft", price: 26.99},
                                            {id: 4, name: "Counter-Strike: Global Offensive", price: 0},
                                            {id: 5, name: "Roblox", price: 0},
                                            {id: 6, name: "Grand Theft Auto V", price: 29.99},
                                            {id: 7, name: "Valorant", price: 0},
                                            {id: 8, name: "Forza Horizon 5", price: 59.99}
                                        ]
                    description: Full details of a given game
                '404':
                    content:
                        application/json:
                            schema:
                                type: string
                            examples:
                                Error message:
                                    value:
                                        error: Error message.
                    description: Return error when no game
            operationId: id
            summary: Get full details of a game
            description: Returns full details of a given id game
